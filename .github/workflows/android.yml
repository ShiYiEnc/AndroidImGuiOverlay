name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain
      - name: Check APK and native alignment
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p app/build/verification
          unzip -j "$apk" 'lib/arm64-v8a/*.so' -d app/build/verification
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for library in app/build/verification/*.so; do
            "$readelf" -lW "$library" | awk '
              $1 == "LOAD" { count++; if ($NF != "0x4000" && $NF != "0x10000") { print "Invalid alignment: " $0; bad=1 } }
              END { if (count == 0 || bad) exit 1 }
            '
          done
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
          retention-days: 14
